name: Vérification Python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: python -m pip install -r requirements.txt
      - name: Syntaxe Python
        run: python -m py_compile bot.py
      - name: Test des commandes et du rôle opt-in
        run: |
          python - <<'PY'
          import bot
          assert bot.bot.tree.get_command("damall") is not None
          assert bot.get_opt_in_role(type("Guild", (), {"roles": []})()) is None
          assert "DM Annonces" == bot.ROLE_NAME
          assert not hasattr(bot, "SignupView")
          assert not hasattr(bot, "AdminView")
          print("Tests OK")
          PY
