name: Vérification Python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: python -m pip install -r requirements.txt
      - name: Syntaxe Python
        run: python -m py_compile bot.py
      - name: Test stockage des consentements
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from bot import Storage
          with TemporaryDirectory() as directory:
              db = Storage(Path(directory) / "storage.sqlite3")
              assert db.subscribers(123) == []
              assert db.subscribe(123, 456)
              assert not db.subscribe(123, 456)
              assert db.subscribed(123, 456)
              assert db.subscribers(123) == [456]
              assert db.unsubscribe(123, 456)
              assert not db.subscribed(123, 456)
              db.save_panel(123, 100, 200)
              assert db.panel_id(123, 100) == 200
          print("Tests OK")
          PY
